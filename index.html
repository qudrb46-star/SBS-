function makeCard(c){
  const zoom = ZOOM[c.room] || '';
  const TEXTBOOK_KW = ['포토샵','일러스트','캐드','컴활','모스','스케치업','맥스'];
  const hasTextbook = TEXTBOOK_KW.some(kw => c.name.includes(kw));
  const textbookExtra = hasTextbook
    ? '\n· 교재 : \n· 교재구매사이트 : https://www.kedustore.com\n＊<필수> 개강일, 교재 꼭! 인지해주세요\n* 개강 3일전 수업 취소, 연기, 시간 및 과목변경 불가능합니다.'
    : '';
  const datesLine = c.dates && !c.days.includes('~') ? `\n· 수업일 : ${c.dates}` : '';
  const holidayLine = c.holiday ? `\n· 휴강일 : ${c.holiday}` : '';
  const isOnline = c.room === '비대';
  const zoomLine = isOnline ? '' : `\n· 줌 링크 : ${zoom}`;
  const faceLine = isOnline ? '비대면' : '대면';
  const copyText = `■ SBS컴퓨터아트학원 부산점 개강안내\n· 수강과목 : ${c.name}(${c.days})\n· 개강일 : ${c.start}\n· 종강일 : ${c.end}\n· 수강시간 : ${c.time}\n· 강의실 : ${c.room} 강의장${zoomLine}\n· 대면/비대면 : ${faceLine}${datesLine}${holidayLine}${textbookExtra}`;
  return `<div class="card" data-room="${c.room}" data-copy="${encodeURIComponent(copyText)}" onclick="toggleSelect(event,this)">
  <div class="card-check">✓</div>
  <div class="card-head">
    <div><div class="card-name">${c.name}</div><div class="card-sub">${c.days} | ${c.time}</div></div>
    <span class="room-badge rb-${c.room}">${c.room} 강의장</span>
  </div>
  <hr class="card-hr">
  <ul class="info-list">
    <li><span class="il-label">수강과목</span><span class="il-val">${c.name}(${c.days})</span></li>
    <li><span class="il-label">개강일</span><span class="il-val">${c.start}</span></li>
    <li><span class="il-label">종강일</span><span class="il-val">${c.end}</span></li>
    <li><span class="il-label">수강시간</span><span class="il-val">${c.time}</span></li>
    <li><span class="il-label">강의실</span><span class="il-val">${c.room} 강의장</span></li>
    ${!isOnline ? `<li><span class="il-label">줌 링크</span><a class="il-link" href="${zoom}" target="_blank" onclick="event.stopPropagation()">${zoom}</a></li>` : ''}
    <li><span class="il-label">대면/비대면</span><span class="il-bold">${isOnline ? '비대면' : '대면'}</span></li>
    ${c.dates && !c.days.includes('~') ? `<li><span class="il-label">수업일</span><span class="il-val dates-val">${c.dates}</span></li>` : ''}
    ${c.holiday ? `<li><span class="il-label">휴강일</span><span class="il-val holiday-val">${c.holiday}</span></li>` : ''}
    ${hasTextbook ? `<li style="margin-top:4px"><span class="il-label">교재구매</span><a class="il-link" href="https://www.kedustore.com" target="_blank" onclick="event.stopPropagation()">https://www.kedustore.com</a></li>` : ''}
  </ul>
  ${hasTextbook ? `<div class="textbook-notice">
    <span class="tb-required">＊필수</span> 개강일, 교재 꼭! 인지해주세요<br>
    <span class="tb-warn">＊</span> 개강 3일전 수업 취소, 연기, 시간 및 과목변경 불가능합니다.
  </div>` : ''}
  <button class="copy-btn" onclick='event.stopPropagation();copyCard(this,decodeURIComponent("${encodeURIComponent(copyText)}"))'>📋 복사하기</button>
</div>`;
}

const grid = document.getElementById('cardGrid');
grid.innerHTML = COURSES.map(makeCard).join('');

const btns = document.querySelectorAll('.filter-btn');
const countEl = document.getElementById('visibleCount');
const searchInput = document.getElementById('searchInput');
const emptyMsg = document.getElementById('emptyMsg');
const multiBar = document.getElementById('multiBar');
const multiCount = document.getElementById('multiCount');
const multiCopyBtn = document.getElementById('multiCopyBtn');
let currentRoom = 'ALL';
let selectedCards = new Set();

function filterCards(){
  const cards = document.querySelectorAll('.card[data-room]');
  const q = searchInput.value.trim().toLowerCase();
  let n = 0;
  cards.forEach(card => {
    const roomOk = currentRoom === 'ALL' || card.dataset.room === currentRoom;
    const textOk = !q || card.textContent.toLowerCase().includes(q);
    card.classList.toggle('hidden', !(roomOk && textOk));
    if(roomOk && textOk) n++;
  });
  countEl.textContent = n;
  emptyMsg.style.display = n === 0 ? 'block' : 'none';
}

btns.forEach(btn => btn.addEventListener('click', () => {
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRoom = btn.dataset.room;
  filterCards();
}));
searchInput.addEventListener('input', filterCards);

function toggleSelect(e, card){
  if(e.target.closest('.copy-btn') || e.target.closest('.il-link')) return;
  if(selectedCards.has(card)){ selectedCards.delete(card); card.classList.remove('selected'); }
  else { selectedCards.add(card); card.classList.add('selected'); }
  updateMultiBar();
}

function updateMultiBar(){
  const n = selectedCards.size;
  multiCount.textContent = n + '개 선택됨';
  multiBar.classList.toggle('show', n > 0);
}

function clearSelection(){
  selectedCards.forEach(c => c.classList.remove('selected'));
  selectedCards.clear();
  updateMultiBar();
}

function selectAllVisible(){
  document.querySelectorAll('.card[data-room]:not(.hidden)').forEach(card => {
    selectedCards.add(card); card.classList.add('selected');
  });
  updateMultiBar();
}

function copySelected(){
  const texts = [];
  document.querySelectorAll('.card[data-room]').forEach(card => {
    if(selectedCards.has(card)) texts.push(decodeURIComponent(card.dataset.copy));
  });
  const combined = texts.join('\n\n──────────────\n\n');
  const done = () => {
    multiCopyBtn.classList.add('ok');
    multiCopyBtn.textContent = '✅ ' + texts.length + '개 복사됨!';
    setTimeout(() => { multiCopyBtn.classList.remove('ok'); multiCopyBtn.textContent = '📋 선택 항목 복사'; }, 2500);
  };
  if(navigator.clipboard){ navigator.clipboard.writeText(combined).then(done); }
  else { const ta=document.createElement('textarea');ta.value=combined;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done(); }
}

function copyCard(btn, text){
  const done = () => {
    btn.classList.add('ok'); btn.textContent = '✅ 복사됨!';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = '📋 복사하기'; }, 2000);
  };
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done); }
  else { const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done(); }
}

filterCards();
</script>
