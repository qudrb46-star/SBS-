*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#e0e0e0;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.site-header{background:#111;border-bottom:2px solid #f0c040;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.site-header h1{font-size:1rem;font-weight:700;color:#fff}
.site-header span{font-size:0.75rem;color:#888}
.filter-bar{background:#222;border-bottom:1px solid #2e2e2e;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-label{font-size:0.7rem;color:#888;letter-spacing:0.1em;margin-right:2px}
.filter-btn{background:#2e2e2e;border:1px solid #3a3a3a;color:#bbb;padding:5px 11px;font-size:0.72rem;font-family:inherit;border-radius:4px;cursor:pointer;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:#f0c040;color:#111;border-color:#f0c040;font-weight:700}
.search-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-input{background:#2e2e2e;border:1px solid #3a3a3a;color:#e0e0e0;padding:5px 12px;font-size:0.72rem;font-family:inherit;border-radius:4px;outline:none;width:160px}
.search-input::placeholder{color:#555}
.count-badge{font-size:0.7rem;color:#666;white-space:nowrap}
.count-badge span{color:#f0c040;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:#111;padding:1px}
.card{background:#242424;padding:1.3rem 1.5rem 1.1rem;transition:background .2s}
.card:hover{background:#2c2c2c}
.card.hidden{display:none}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-size:0.97rem;font-weight:700;color:#fff;line-height:1.3}
.card-sub{font-size:0.7rem;color:#888;margin-top:3px}
.room-badge{font-size:0.62rem;font-weight:700;padding:3px 7px;border-radius:3px;white-space:nowrap;flex-shrink:0;margin-left:8px;margin-top:2px}
.card-hr{border:none;border-top:1px solid rgba(255,255,255,0.07);margin:10px 0}
.info-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.info-list li{display:flex;gap:8px;font-size:0.8rem;line-height:1.4}
.info-list li::before{content:'·';color:#555;flex-shrink:0;padding-top:1px}
.il-label{color:#777;min-width:60px;flex-shrink:0}
.il-val{color:#ddd}
.il-link{color:#5b9cf6;text-decoration:none;word-break:break-all;font-size:0.74rem}
.il-link:hover{text-decoration:underline}
.il-bold{color:#fff;font-weight:700}
.copy-btn{width:100%;padding:8px;background:#2e2e2e;border:none;border-radius:5px;color:#aaa;font-size:0.78rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.copy-btn:hover{background:#3a3a3a;color:#fff}
.copy-btn.ok{background:#1e3d1e;color:#6dcc6d}
.rb-A{background:#f0c040;color:#111}.rb-B{background:#5b9cf6;color:#111}.rb-C{background:#7ec8e3;color:#111}
.rb-D{background:#b0e57c;color:#111}.rb-E{background:#d4a0f0;color:#111}.rb-F{background:#f0a080;color:#111}
.rb-G{background:#80d0a0;color:#111}.rb-H{background:#f07070;color:#fff}.rb-I{background:#f0d080;color:#111}

.empty{padding:3rem;text-align:center;color:#555;display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.filter-bar{gap:6px}.search-wrap{margin-left:0;width:100%}.search-input{flex:1}}
</style>

function makeCard(c){
  const zoom = ZOOM[c.room] || '';
  const copyText = `■ SBS컴퓨터아트학원 부산점 개강안내\n· 수강과목 : ${c.name}(${c.days})\n· 개강일 : ${c.start}\n· 종강일 : ${c.end}\n· 수강시간 : ${c.time}\n· 강의실 : ${c.room} 강의장\n· 줌 링크 : ${zoom}\n· 대면/비대면 : 대면`;
  const roomLabel = c.room.length <= 1 ? c.room+'강의장' : c.room+'강의장';
  return `<div class="card" data-room="${c.room}">
  <div class="card-head">
    <div><div class="card-name">${c.name}</div><div class="card-sub">${c.days} | ${c.time}</div></div>
    <span class="room-badge rb-${c.room}">${roomLabel}</span>
  </div>
  <hr class="card-hr">
  <ul class="info-list">
    <li><span class="il-label">수강과목</span><span class="il-val">${c.name}(${c.days})</span></li>
    <li><span class="il-label">개강일</span><span class="il-val">${c.start}</span></li>
    <li><span class="il-label">종강일</span><span class="il-val">${c.end}</span></li>
    <li><span class="il-label">수강시간</span><span class="il-val">${c.time}</span></li>
    <li><span class="il-label">강의실</span><span class="il-val">${c.room} 강의장</span></li>
    <li><span class="il-label">줌 링크</span><a class="il-link" href="${zoom}" target="_blank">${zoom}</a></li>
    <li><span class="il-label">대면/비대면</span><span class="il-bold">대면</span></li>
  </ul>
  <button class="copy-btn" onclick='copyCard(this,${JSON.stringify(copyText)})'>📋 복사하기</button>
</div>`;
}

const grid = document.getElementById('cardGrid');
grid.innerHTML = COURSES.map(makeCard).join('');

const btns = document.querySelectorAll('.filter-btn');
const countEl = document.getElementById('visibleCount');
const searchInput = document.getElementById('searchInput');
const emptyMsg = document.getElementById('emptyMsg');
let currentRoom = 'ALL';

function filterCards(){
  const cards = document.querySelectorAll('.card[data-room]');
  const q = searchInput.value.trim().toLowerCase();
  let n = 0;
  cards.forEach(card => {
    const roomOk = currentRoom === 'ALL' || card.dataset.room === currentRoom;
    const textOk = !q || card.textContent.toLowerCase().includes(q);
    card.classList.toggle('hidden', !(roomOk && textOk));
    if(roomOk && textOk) n++;
  });
  countEl.textContent = n;
  emptyMsg.style.display = n === 0 ? 'block' : 'none';
}

btns.forEach(btn => btn.addEventListener('click', () => {
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRoom = btn.dataset.room;
  filterCards();
}));
searchInput.addEventListener('input', filterCards);

function copyCard(btn, text){
  const done = () => {
    btn.classList.add('ok'); btn.textContent = '✅ 복사됨!';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = '📋 복사하기'; }, 2000);
  };
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done); }
  else {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  }
}

filterCards();
